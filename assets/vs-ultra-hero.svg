<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">VS Ultra — Coding Workspace for Android</title>
  <desc id="desc">A dark navy banner with a glowing cyan, blue and violet VS monogram framed by code brackets and neon orbital rings, with the VS Ultra title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/><stop offset=".55" stop-color="#0a1022"/><stop offset="1" stop-color="#090719"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45f3ff"/><stop offset=".48" stop-color="#4388ff"/><stop offset="1" stop-color="#b45cff"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5fdff"/><stop offset=".55" stop-color="#b9d7ff"/><stop offset="1" stop-color="#d8b7ff"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#245bff" stop-opacity=".34"/><stop offset=".55" stop-color="#6b35d8" stop-opacity=".12"/><stop offset="1" stop-color="#071020" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="32"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="470" cy="430" r="420" fill="url(#halo)"/>
  <circle cx="470" cy="430" r="300" fill="#226dff" opacity=".10" filter="url(#soft)"/>
  <g opacity=".20" stroke="#4b75b8" stroke-width="1">
    <path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/>
    <path d="M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900M1440 0V900"/>
  </g>
  <g transform="translate(470 420)" fill="none" stroke="url(#neon)" filter="url(#glow)">
    <ellipse rx="300" ry="155" stroke-width="3" opacity=".75" transform="rotate(-27)"/>
    <ellipse rx="300" ry="155" stroke-width="2" opacity=".45" transform="rotate(27)"/>
    <ellipse rx="245" ry="245" stroke-width="2" opacity=".38"/>
    <path d="M-205 -100L-285 -100L-285 100L-205 100" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M205 -100L285 -100L285 100L205 100" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(470 420)" filter="url(#glow)">
    <path d="M-125 -100L-35 -100L-105 0L-35 100L-125 100L-195 0Z" fill="url(#neon)" opacity=".96"/>
    <path d="M-5 -100H105C165 -100 190 -65 190 -25C190 12 168 33 130 44L25 75C10 80 7 91 7 100H-82C-82 54 -56 23 -10 9L91 -21C107 -26 111 -35 111 -43C111 -54 103 -62 87 -62H-5Z" fill="url(#neon)"/>
    <path d="M-8 -100H105" stroke="#d9fbff" stroke-width="5" opacity=".85"/>
  </g>
  <g fill="#75dfff" opacity=".9">
    <circle cx="185" cy="230" r="4"/><circle cx="730" cy="230" r="3"/><circle cx="760" cy="625" r="4"/><circle cx="175" cy="640" r="3"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="1110" y="350" fill="url(#titleGrad)" font-size="104" font-weight="800" letter-spacing="-3">VS Ultra</text>
    <rect x="920" y="390" width="380" height="3" rx="2" fill="url(#neon)" opacity=".9"/>
    <text x="1110" y="455" fill="#d7e7ff" font-size="31" font-weight="500">Your Coding Workspace.</text>
    <text x="1110" y="500" fill="#d7e7ff" font-size="31" font-weight="500">Reimagined for Android.</text>
    <text x="1110" y="690" fill="#8da8d5" font-size="23" letter-spacing="7">CODE. CREATE. BUILD. ANYWHERE.</text>
  </g>
  <path d="M870 760H1350" stroke="url(#neon)" stroke-width="2" opacity=".45"/>
</svg>