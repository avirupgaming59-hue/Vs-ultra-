name: Build & Publish Release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example v1.0.4
        required: true
        default: v1.0.4
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Release tag may contain only letters, numbers, dots, underscores, and hyphens."
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing Android signing secrets. Add KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD in GitHub Settings -> Secrets and variables -> Actions. See RELEASE_GUIDE.md for setup steps."
            exit 1
          fi
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON_BASE64. Firebase Gemini is unavailable without the Firebase app configuration."
            exit 1
          fi

      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          python -m json.tool app/google-services.json > /dev/null

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "${{ runner.temp }}/my-upload-key.jks"
          echo "KEYSTORE_PATH=${{ runner.temp }}/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Install Android SDK 37.2
        run: yes | sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Set up Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.2"

      - name: Build Signed Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare Release APK artifact
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Expected signed APK not found at $APK_SRC"
            exit 1
          fi
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          BADGING="$("$AAPT" dump badging "$APK_SRC")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.aistudio.vsshell.krmxvp' versionCode='4' versionName='1.0.4'"
          "$APKSIGNER" verify --print-certs "$APK_SRC"
          mkdir -p dist
          FINAL_APK="dist/vs-ultra-${RELEASE_TAG}-release.apk"
          cp "$APK_SRC" "$FINAL_APK"
          sha256sum "$FINAL_APK" | tee "${FINAL_APK}.sha256"
          ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag }}
          name: VS Ultra ${{ inputs.release_tag }}
          generate_release_notes: true
          files: |
            dist/vs-ultra-${{ inputs.release_tag }}-release.apk
            dist/vs-ultra-${{ inputs.release_tag }}-release.apk.sha256

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/my-upload-key.jks"
